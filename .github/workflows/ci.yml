name: CPU checks
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall -q worker gateway tests scripts
      - name: Install gateway and test dependencies
        run: python -m pip install -r gateway/requirements.lock
      - name: Run CPU tests (no GPU coverage)
        run: python -m unittest discover -s tests -v
      - name: Validate setup idempotence and Compose
        shell: bash
        run: |
          sh -n scripts/setup.sh
          sh scripts/setup.sh
          cp .secrets/worker_token "$RUNNER_TEMP/worker_token"
          cp .secrets/mcp_token "$RUNNER_TEMP/mcp_token"
          sh scripts/setup.sh
          cmp .secrets/worker_token "$RUNNER_TEMP/worker_token"
          cmp .secrets/mcp_token "$RUNNER_TEMP/mcp_token"
          grep -qx ACCEPT_NONCOMMERCIAL_MODELS=false .env
          sh scripts/setup.sh --accept-noncommercial
          grep -qx ACCEPT_NONCOMMERCIAL_MODELS=true .env
          docker compose config --quiet
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/setup.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
